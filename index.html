<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#77a8d8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wetter" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Wetter</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; background:#4e83b7; }
    body { min-height:100dvh; overflow-x:hidden; color:#fff; }
    .sky { position:fixed; inset:0; z-index:-3; background:linear-gradient(180deg,#5d95ca 0%,#84b5de 45%,#c6ddef 100%); }
    .sky:after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 76% 18%, rgba(255,255,255,.28), transparent 24%), radial-gradient(circle at 25% 38%, rgba(255,255,255,.14), transparent 28%); }
    .status-blur { position:fixed; top:0; left:0; right:0; height:calc(env(safe-area-inset-top) + 26px); z-index:20; background:rgba(90,143,190,.24); -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%); border-bottom:1px solid rgba(255,255,255,.08); pointer-events:none; }
    .app { width:min(100%, 520px); margin:0 auto; padding:calc(env(safe-area-inset-top) + 34px) 16px calc(env(safe-area-inset-bottom) + 28px); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:26px; }
    .round { width:44px; height:44px; border:0; border-radius:50%; color:white; font-size:20px; background:rgba(255,255,255,.15); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.17); }
    .place { flex:1; min-width:0; text-align:center; }
    .place strong { display:block; font-size:18px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .place span { font-size:12px; opacity:.72; }
    .hero { text-align:center; padding:8px 0 26px; text-shadow:0 2px 16px rgba(20,60,100,.16); }
    .temp { font-size:92px; line-height:.95; font-weight:250; letter-spacing:-6px; }
    .condition { font-size:21px; font-weight:600; margin-top:10px; }
    .hilow { font-size:16px; margin-top:5px; opacity:.92; }
    .card { background:rgba(255,255,255,.14); -webkit-backdrop-filter:blur(24px) saturate(135%); backdrop-filter:blur(24px) saturate(135%); border:1px solid rgba(255,255,255,.18); border-radius:24px; box-shadow:0 12px 36px rgba(20,60,90,.13); margin:12px 0; overflow:hidden; }
    .card-title { padding:15px 16px 10px; font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.7; }
    .hourly { display:flex; overflow-x:auto; scrollbar-width:none; padding:2px 10px 14px; gap:4px; }
    .hourly::-webkit-scrollbar { display:none; }
    .hour { min-width:66px; text-align:center; padding:8px 4px; }
    .hour b { display:block; font-size:14px; }
    .hour .ico { font-size:27px; margin:9px 0; }
    .hour .rain { height:16px; color:#d9f0ff; font-size:11px; }
    .hour strong { font-size:17px; }
    .days { padding:0 14px 8px; }
    .day { display:grid; grid-template-columns:1.15fr 42px 48px 1fr; align-items:center; min-height:54px; border-top:1px solid rgba(255,255,255,.12); }
    .day:first-child { border-top:0; }
    .day .ico { text-align:center; font-size:24px; }
    .range { height:5px; border-radius:99px; background:rgba(255,255,255,.2); overflow:hidden; margin-left:8px; }
    .range i { display:block; height:100%; border-radius:inherit; background:rgba(255,255,255,.72); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat { padding:16px; min-height:116px; }
    .stat .label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.66; }
    .stat .value { font-size:30px; margin-top:16px; }
    .stat small { display:block; margin-top:6px; opacity:.7; }
    .search { position:fixed; inset:0; z-index:40; background:rgba(20,48,72,.35); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); display:none; padding:calc(env(safe-area-inset-top) + 18px) 16px 22px; }
    .search.open { display:block; }
    .searchbox { max-width:520px; margin:auto; }
    .searchrow { display:flex; gap:10px; }
    input { width:100%; border:0; outline:0; color:#fff; background:rgba(255,255,255,.16); border-radius:16px; padding:14px 16px; font:inherit; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
    input::placeholder { color:rgba(255,255,255,.62); }
    .results { margin-top:10px; background:rgba(30,73,105,.42); border-radius:18px; overflow:hidden; }
    .result { width:100%; color:#fff; border:0; border-top:1px solid rgba(255,255,255,.1); background:transparent; text-align:left; padding:14px 16px; font:inherit; }
    .result:first-child { border-top:0; }
    .result small { display:block; opacity:.64; margin-top:3px; }
    .loading { text-align:center; opacity:.75; padding:30px 0; }
    .favorites { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:-12px 0 10px; padding:4px 0 8px; }
    .favorites::-webkit-scrollbar{display:none}.favchip{flex:0 0 auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.13);backdrop-filter:blur(16px);color:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px}.favchip.active{background:rgba(255,255,255,.25)}
    .notice-text{padding:0 16px 16px;line-height:1.4}.notice-text strong{display:block;font-size:17px;margin-bottom:4px}.notice-text small{opacity:.75}
    .hour .mm{height:14px;font-size:10px;opacity:.75;color:#fff;margin-top:1px}
    @media (min-width:700px) { .app { padding-left:0; padding-right:0; } }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="status-blur"></div>
  <main class="app">
    <div class="topbar">
      <button class="round" id="locBtn" aria-label="Aktueller Standort">⌖</button>
      <div class="place"><strong id="place">Berlin</strong><span id="updated">Wetter wird geladen …</span></div>
      <button class="round" id="favBtn" aria-label="Favorit speichern">☆</button>
      <button class="round" id="searchBtn" aria-label="Ort suchen">⌕</button>
    </div>

    <div class="favorites" id="favorites"></div>

    <section class="hero">
      <div class="temp" id="temp">--°</div>
      <div class="condition" id="condition">Lädt …</div>
      <div class="hilow" id="hilow">H: --° · T: --°</div>
    </section>

    <section class="card notice" id="noticeCard" style="display:none"><div class="card-title">Wetterhinweis</div><div id="notice" class="notice-text"></div></section>

    <section class="card">
      <div class="card-title">Stündliche Vorhersage</div>
      <div class="hourly" id="hourly"><div class="loading">Lädt …</div></div>
    </section>

    <section class="card">
      <div class="card-title">7-Tage-Vorhersage</div>
      <div class="days" id="days"></div>
    </section>

    <section class="stats">
      <div class="card stat"><div class="label">Gefühlt</div><div class="value" id="feels">--°</div><small id="feelNote">Aktuell</small></div>
      <div class="card stat"><div class="label">Wind</div><div class="value" id="wind">--</div><small id="windDir">km/h</small></div>
      <div class="card stat"><div class="label">Luftfeuchte</div><div class="value" id="humidity">--%</div><small>Aktuell</small></div>
      <div class="card stat"><div class="label">Niederschlag</div><div class="value" id="precip">--%</div><small id="precipMm">-- mm · nächste Stunde</small></div>
    </section>
  </main>

  <div class="search" id="search">
    <div class="searchbox">
      <div class="searchrow"><input id="query" placeholder="Stadt suchen" autocomplete="off" /><button class="round" id="closeSearch">×</button></div>
      <div class="results" id="results"></div>
    </div>
  </div>

<script>
const $=s=>document.querySelector(s);
const weatherText=c=>({0:'Klar',1:'Überwiegend klar',2:'Teilweise bewölkt',3:'Bewölkt',45:'Nebel',48:'Reifnebel',51:'Leichter Nieselregen',53:'Nieselregen',55:'Starker Nieselregen',56:'Gefrierender Nieselregen',57:'Starker gefrierender Nieselregen',61:'Leichter Regen',63:'Regen',65:'Starker Regen',66:'Gefrierender Regen',67:'Starker gefrierender Regen',71:'Leichter Schneefall',73:'Schneefall',75:'Starker Schneefall',77:'Schneegriesel',80:'Leichte Regenschauer',81:'Regenschauer',82:'Starke Regenschauer',85:'Leichte Schneeschauer',86:'Starke Schneeschauer',95:'Gewitter',96:'Gewitter mit Hagel',99:'Starkes Gewitter mit Hagel'}[c]||'Wetter');
const weatherIcon=(c,isDay=1)=> c===0?(isDay?'☀️':'🌙'):c<=2?(isDay?'🌤️':'☁️'):c===3?'☁️':c<60?'🌫️':c<70?'🌧️':c<80?'❄️':c<90?(c<83?'🌦️':'🌨️'):'⛈️';
const dayNames=['So','Mo','Di','Mi','Do','Fr','Sa'];
const compass=d=>['N','NO','O','SO','S','SW','W','NW'][Math.round(d/45)%8];
let favorites=JSON.parse(localStorage.getItem('weatherFavorites')||'[]');
let currentPlace=JSON.parse(localStorage.getItem('weatherPlace')||'null')||{name:'Berlin',latitude:52.52,longitude:13.41,timezone:'Europe/Berlin',country:'Deutschland'};

function samePlace(a,b){return Math.abs(a.latitude-b.latitude)<.01&&Math.abs(a.longitude-b.longitude)<.01}
function renderFavorites(){ $('#favBtn').textContent=favorites.some(x=>samePlace(x,currentPlace))?'★':'☆'; $('#favorites').innerHTML=favorites.map((x,i)=>`<button class="favchip ${samePlace(x,currentPlace)?'active':''}" data-f="${i}">${x.name}</button>`).join(''); document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>loadWeather(favorites[+b.dataset.f])); }
function weatherNotice(d){let maxRain=Math.max(...d.hourly.precipitation.slice(0,24)), maxProb=Math.max(...d.hourly.precipitation_probability.slice(0,24)), codes=d.hourly.weather_code.slice(0,24), maxWind=d.current.wind_speed_10m; if(codes.some(c=>c>=95)) return ['Gewitter möglich','In den nächsten 24 Stunden zeigt die Vorhersage Gewitter.']; if(maxRain>=10) return ['Stärkerer Regen möglich',`Bis zu ${maxRain.toFixed(1)} mm pro Stunde werden vorhergesagt.`]; if(maxWind>=60) return ['Starker Wind',`Aktuell etwa ${Math.round(maxWind)} km/h.`]; if(maxProb>=80) return ['Regen sehr wahrscheinlich',`Die höchste Regenwahrscheinlichkeit der nächsten 24 Stunden liegt bei ${maxProb} %.`]; return null}
async function loadWeather(p=currentPlace){
  currentPlace=p; localStorage.setItem('weatherPlace',JSON.stringify(p));
  $('#place').textContent=p.name; renderFavorites();
  $('#updated').textContent='Wetter wird geladen …';
  const params=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,timezone:'auto',forecast_days:'7',current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day',hourly:'temperature_2m,precipitation_probability,precipitation,weather_code,is_day',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'});
  const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params); if(!r.ok) throw Error('Wetterdaten konnten nicht geladen werden');
  const d=await r.json(), c=d.current;
  $('#temp').textContent=Math.round(c.temperature_2m)+'°'; $('#condition').textContent=weatherText(c.weather_code);
  $('#hilow').textContent=`H: ${Math.round(d.daily.temperature_2m_max[0])}° · T: ${Math.round(d.daily.temperature_2m_min[0])}°`;
  $('#feels').textContent=Math.round(c.apparent_temperature)+'°'; $('#wind').textContent=Math.round(c.wind_speed_10m); $('#windDir').textContent=`km/h · ${compass(c.wind_direction_10m)}`; $('#humidity').textContent=Math.round(c.relative_humidity_2m)+'%';
  const nowIndex=Math.max(0,d.hourly.time.findIndex(t=>t>=c.time)); const rainProb=d.hourly.precipitation_probability[nowIndex]??0, rainMm=d.hourly.precipitation[nowIndex]??0; $('#precip').textContent=rainProb+'%'; $('#precipMm').textContent=(rainProb===0?'Kein Regen erwartet':rainProb<30?'Regen möglich':rainProb<70?'Regen nicht sicher':'Regen wahrscheinlich')+' · '+rainMm.toFixed(1)+' mm';
  $('#updated').textContent='Aktualisiert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  let hs=''; for(let i=nowIndex;i<Math.min(nowIndex+24,d.hourly.time.length);i++){const t=new Date(d.hourly.time[i]);hs+=`<div class="hour"><b>${i===nowIndex?'Jetzt':String(t.getHours()).padStart(2,'0')+' Uhr'}</b><div class="ico">${weatherIcon(d.hourly.weather_code[i],d.hourly.is_day[i])}</div><div class="rain">${d.hourly.precipitation_probability[i]?d.hourly.precipitation_probability[i]+'%':''}</div><div class="mm">${d.hourly.precipitation[i]>0?d.hourly.precipitation[i].toFixed(1)+' mm':''}</div><strong>${Math.round(d.hourly.temperature_2m[i])}°</strong></div>`;} $('#hourly').innerHTML=hs;
  const n=weatherNotice(d); $('#noticeCard').style.display=n?'block':'none'; if(n) $('#notice').innerHTML=`<strong>${n[0]}</strong>${n[1]}<br><small>Automatischer Hinweis aus der Vorhersage, keine amtliche Wetterwarnung.</small>`;
  const min=Math.min(...d.daily.temperature_2m_min),max=Math.max(...d.daily.temperature_2m_max); let ds=''; d.daily.time.forEach((x,i)=>{const date=new Date(x+'T12:00:00'); const lo=Math.round(d.daily.temperature_2m_min[i]),hi=Math.round(d.daily.temperature_2m_max[i]); const width=Math.max(14,((hi-lo)/(max-min||1))*100); ds+=`<div class="day"><div>${i===0?'Heute':dayNames[date.getDay()]}</div><div class="ico">${weatherIcon(d.daily.weather_code[i],1)}</div><div>${lo}°&nbsp; ${hi}°</div><div class="range"><i style="width:${width}%"></i></div></div>`;}); $('#days').innerHTML=ds;
}

$('#favBtn').onclick=()=>{const i=favorites.findIndex(x=>samePlace(x,currentPlace)); if(i>=0) favorites.splice(i,1); else favorites.push({...currentPlace}); localStorage.setItem('weatherFavorites',JSON.stringify(favorites)); renderFavorites();};
let timer; $('#searchBtn').onclick=()=>{ $('#search').classList.add('open'); setTimeout(()=>$('#query').focus(),100); }; $('#closeSearch').onclick=()=>$('#search').classList.remove('open');
$('#query').addEventListener('input',()=>{clearTimeout(timer); const q=$('#query').value.trim(); if(q.length<2){$('#results').innerHTML='';return;} timer=setTimeout(async()=>{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language=de&format=json'); const j=await r.json(); $('#results').innerHTML=(j.results||[]).map((x,i)=>`<button class="result" data-i="${i}"><b>${x.name}</b><small>${[x.admin1,x.country].filter(Boolean).join(', ')}</small></button>`).join('')||'<div class="loading">Kein Ort gefunden</div>'; [...document.querySelectorAll('.result')].forEach((b,i)=>b.onclick=()=>{const x=j.results[i]; $('#search').classList.remove('open'); $('#query').value=''; $('#results').innerHTML=''; loadWeather({name:x.name,latitude:x.latitude,longitude:x.longitude,timezone:x.timezone,country:x.country});});},250);});
async function reverseGeocode(latitude,longitude){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=de`);
    if(r.ok){
      const j=await r.json();
      const city=j.city||j.locality||j.principalSubdivision||'';
      const country=j.countryName||'';
      if(city) return {name:[city,country].filter(Boolean).join(', '),country};
    }
  }catch(e){console.warn('Reverse-Geocoding fehlgeschlagen',e)}
  return {name:'Mein Standort',country:''};
}
$('#locBtn').onclick=()=>{if(!navigator.geolocation){alert('Standort wird von diesem Browser nicht unterstützt.');return;} $('#updated').textContent='Standort wird bestimmt …'; navigator.geolocation.getCurrentPosition(async pos=>{const place=await reverseGeocode(pos.coords.latitude,pos.coords.longitude); const p={name:place.name,latitude:pos.coords.latitude,longitude:pos.coords.longitude,country:place.country}; loadWeather(p);},()=>{$('#updated').textContent='Standortzugriff nicht erlaubt';},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});};
loadWeather().catch(e=>{console.error(e);$('#condition').textContent='Keine Verbindung';});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
